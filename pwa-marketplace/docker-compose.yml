# filepath: pwa-marketplace/docker-compose.yml
# To run use the usual command: docker compose -d up

# version: "3.8" // When I run I receive a warning msg noticing attribute `version` is obsolete
# and it suggests to remove it, so I did it

# Reusable DB credentials defined via YAML anchor, to avoid repetition.
# So we can use `<<: *database-credentials` to merge/include these env vars in each service
x-database-credentials: &database-credentials
  # Files mounted by Docker Compose secrets (available at /run/secrets/<name>)
  MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
  MYSQL_DATABASE: marketplace_db
  MYSQL_DB_USER: db_user
  MYSQL_DB_USER_PASSWORD_FILE: /run/secrets/mysql_db_user_password

services:
  frontend-customer:
    build:
      # Corresponds to the source code folder considered as context to create the Docker image
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_TYPE: customer
    ports:
      # First number is host machine's port and second is container's port
      - "3000:3000"
    # Mounting host machine's path to container's path. This way,
    # changes in host machine's path are reflected in container's path without rebuilding the image.
    # Before the colon, host machine's path and after, it's the container's path
    # Choose rw for dev, :ro or no mount for production
    volumes:
      - ./frontend:/pwa-marketplace/frontend:ro
    # Define environment variables
    environment:
      - REACT_APP_API_BASE_URL=http://backend-customer:5000/api
    depends_on:
      - backend-customer
    restart: always

  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_TYPE: admin
    ports:
      # As host machine is just one, port must be different. However, as in this case
      # each frontend run in different container, they can use the same port
      - "3001:3000"
    volumes:
      - ./frontend:/pwa-marketplace/frontend:ro
    environment:
      - REACT_APP_API_BASE_URL=http://backend-admin:5001/api
    depends_on:
      - backend-admin
    restart: always

  backend-customer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend/app:/pwa-marketplace/backend/app:ro
    depends_on:
      - db
    # Corresponds to working directory inside the container
    working_dir: /pwa-marketplace/backend/app/customer
    # command: Override default command defined in Dockerfile (eg: CMD)
    # command: ["./wait-for-it.sh", "db", "3306", "--", "python", "__init__.py"]
    command: ["python", "__init__.py"]
    # Use mapping style so we can merge the shared DB credentials via YAML anchor
    environment:
      <<: *database-credentials
      BACKEND_TYPE: customer
    # Make the DB user password secret available inside the backend container
    secrets:
      - mysql_db_user_password
    restart: always

  backend-admin:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    volumes:
      - ./backend/app:/pwa-marketplace/backend/app:rw
    depends_on:
      - db
    working_dir: /pwa-marketplace/backend/app/admin
    # command: ["./wait-for-it.sh", "db", "3306", "--", "python", "__init__.py"]
    command: ["python", "__init__.py"]
    environment:
      <<: *database-credentials
      BACKEND_TYPE: admin
    secrets:
      - mysql_db_user_password
    restart: always

  db:
    image: mysql:8.0
    build:
      context: ./database
      dockerfile: Dockerfile
    # Reuse the same credentials block for the database service and keep any MySQL-specific names
    environment:
      <<: *database-credentials
    ports:
      - "3306:3306"
    secrets:
      - mysql_root_password
      - mysql_db_user_password
    volumes:
      # Changing default MySQL data path implies changing default MySQL data folder in config file (my.cnf) and new path permissions
      # Mounting db_data volume to /var/lib/mysql for persistent storage. 
      # This way, /var/lib/mysql data is not lost when container is removed
      - db_data:/var/lib/mysql
      # Mounting init scripts to the path that MySQL image checks to run initialization scripts
      - ./database/docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d/:ro
      # Notice: Set proper permissions (bash: chmod +x) for the mounted script files (if not, MySQL container may not start)
    restart: always

# Define external secrets to avoid hardcoding sensitive info in this file
secrets:
  mysql_root_password:
    file: ./database/secrets/mysql_root_password.txt
    # external: true  -- Valid for Docker Swarm secrets, not for Docker Compose secrets
  mysql_db_user_password:
    file: ./database/secrets/mysql_db_user_password.txt
    # external: true

# Define named volumes as persistent storage
volumes:
  db_data:
